name: seeds

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Semillas nuevas a acuñar"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: seeds
  cancel-in-progress: false

jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Codigo de la app
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Conectar Cloudflare WARP (evita bloqueo de IP datacenter de Azure)
        uses: fscarmen/warp-on-actions@v1.4
        with:
          mode: wireguard
          stack: dual
        continue-on-error: true

      - name: Verificar IP de salida
        run: |
          curl -s https://cloudflare.com/cdn-cgi/trace || true

      - name: Acunar semillas
        run: |
          node tools/mint-seeds.js \
            --count "${{ inputs.count || '30' }}" \
            --pool webos/services/com.webosflux.xuptertv.fidelity.service/seeds-fallback.json \
            --out webos/services/com.webosflux.xuptertv.fidelity.service/seeds-fallback.json \
            --soft-fail

      - name: Enviar en caliente a Render y publicar en rama seeds
        run: |
          curl -s -X POST "https://streaming-qste.onrender.com/feedSeeds" \
            -H "Content-Type: application/json" \
            --data-binary "@webos/services/com.webosflux.xuptertv.fidelity.service/seeds-fallback.json" || true

          git config user.name "xupertv-seeds"
          git config user.email "seeds@users.noreply.github.com"

          cp webos/services/com.webosflux.xuptertv.fidelity.service/seeds-fallback.json /tmp/seeds-latest.json
          git checkout --orphan seeds-temp
          git rm -rf .
          cp /tmp/seeds-latest.json seeds.json
          git add seeds.json
          git commit -m "seeds: pool $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin seeds-temp:seeds
